<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}{{ company_name }}{% endblock %}</title>
    <style type="text/css">
        /* Client-specific resets */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; }

        /* General Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #333333;
        }

        /* Responsive Styles */
        @media only screen and (max-width: 600px) {
            .container { width: 100% !important; }
            .mobile-padding { padding-left: 20px !important; padding-right: 20px !important; }
            .hero-image { height: auto !important; max-width: 100% !important; }
            .btn-full { width: 100% !important; }
            .shift-box { padding: 15px !important; }
        }

        @media only screen and (max-width: 320px) {
            .container { width: 100% !important; }
            .mobile-padding { padding-left: 15px !important; padding-right: 15px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff;">

    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #ffffff;">
        <tr>
            <td align="center" style="padding: 40px 0;">

                <table border="0" cellpadding="0" cellspacing="0" width="600" class="container" style="width: 600px; max-width: 600px;">

                    <!-- Logo -->
                    <tr>
                        <td align="center" style="padding-bottom: 30px;">
                            <table border="0" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="background-color: #1a1a2e; padding: 12px 24px; border-radius: 8px;">
                                        <span style="font-size: 20px; font-weight: 700; color: #ffffff; letter-spacing: 1px;">{{ company_name }}</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Headline -->
                    <tr>
                        <td align="left" class="mobile-padding" style="padding: 0 10px 20px 10px;">
                            <h1 style="margin: 0; font-size: 24px; line-height: 1.3; font-weight: 700; color: #111111;">
                                {% block headline %}{% endblock %}
                            </h1>
                        </td>
                    </tr>

                    {% block content %}{% endblock %}

                    <!-- Signature -->
                    <tr>
                        <td align="left" class="mobile-padding" style="padding: 25px 10px;">
                            <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #555555;">
                                Best regards,<br>
                                <strong style="color: #111111;">The {{ company_name }} Team</strong>
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding: 25px 10px; border-top: 1px solid #e9ecef;">
                            <p style="margin: 0 0 10px 0; font-size: 12px; color: #888888;">
                                This email was sent to {{ user.email }}
                            </p>
                            <p style="margin: 0 0 10px 0; font-size: 12px; color: #888888;">
                                <a href="{{ unsubscribe_url }}" style="color: #666666; text-decoration: underline;">Unsubscribe</a> |
                                <a href="{{ preferences_url }}" style="color: #666666; text-decoration: underline;">Manage Preferences</a>
                            </p>
                            <p style="margin: 0; font-size: 12px; color: #aaaaaa;">
                                &copy; {{ company_name }} &bull; This is an automated message
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
