[pytest]
# DJANGO_SETTINGS_MODULE is also set in the container environment; declaring it
# here makes a bare `pytest` work outside Docker too (CI).
DJANGO_SETTINGS_MODULE = core.settings

# `tests.py` must be listed explicitly: pytest's defaults only match test_*.py
# and *_test.py, which silently skipped shifts/tests.py, leave_management/tests.py
# and finance_integrations/tests.py.
python_files = tests.py test_*.py tests_*.py

# Only the Django apps. The loose backend/test_*.py files are standalone scripts
# that call django.setup() and hit the dev database at import time — not tests.
testpaths = api shifts leave_management finance_integrations

addopts = -p no:cacheprovider
