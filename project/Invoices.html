<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mead Security · Invoices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #faf9f8; }
  body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #e1dfdd; border-radius: 5px; border: 2px solid #faf9f8; }
  ::-webkit-scrollbar-thumb:hover { background: #a19f9d; }
  input[type="checkbox"] { cursor: pointer; }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(8px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* Topbar — let the action row wrap on narrow screens instead of clipping */
  .inv-topbar-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px 12px;
    flex-wrap: wrap;
  }
  .inv-topbar-title { flex: 1 1 280px; min-width: 0; }

  /* Below 1500px, hide the right action pane (drawer can replace it later)
     so the document gets meaningful width. */
  @media (max-width: 1500px) {
    .inv-right-pane { display: none !important; }
  }
  /* Below 1180px, also hide the left list — the document becomes the focus.
     Users can switch invoices from the list at wider widths. */
  @media (max-width: 1180px) {
    .inv-left-pane { display: none !important; }
  }
  /* Below 980px, drop the in-title overdue pill */
  @media (max-width: 980px) {
    .inv-overdue-pill { display: none !important; }
  }
  /* Below 760px, scale the centre stage down for tiny widths */
  @media (max-width: 760px) {
    .inv-doc-stage { transform: scale(0.65) !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="design-system.jsx"></script>
  <script type="text/babel" src="invoice-data.jsx"></script>
  <script type="text/babel" src="invoice-shell.jsx"></script>
  <script type="text/babel" src="invoice-list.jsx"></script>
  <script type="text/babel" src="invoice-document.jsx"></script>
  <script type="text/babel" src="invoice-actions.jsx"></script>
  <script type="text/babel" src="invoice-app.jsx"></script>
</body>
</html>
