<!DOCTYPE html>
<html>
<head>
    <title>AI Agents Test Interface</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .container { background: #f5f5f5; padding: 20px; border-radius: 8px; margin: 20px 0; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .response { background: white; padding: 15px; margin: 10px 0; border-radius: 4px; border-left: 4px solid #007bff; }
        .error { border-left-color: #dc3545; }
        .success { border-left-color: #28a745; }
        .examples { background: #e9ecef; padding: 15px; border-radius: 4px; margin: 10px 0; }
        .example-query { background: #007bff; color: white; padding: 5px 10px; margin: 5px; border-radius: 3px; cursor: pointer; display: inline-block; }
        .example-query:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🤖 AI Agents Test Interface</h1>
    
    <div class="container">
        <h3>Server Status</h3>
        <button onclick="checkHealth()">Check Health</button>
        <div id="health-status"></div>
    </div>

    <div class="container">
        <h3>Test Query</h3>
        <input type="text" id="query-input" placeholder="Enter your query here..." value="Create shifts for John at Store1 tomorrow 9 AM to 5 PM">
        <br>
        <button onclick="sendQuery()">Send Query</button>
        <div id="query-response"></div>
    </div>

    <div class="examples">
        <h3>📝 Example Queries (click to try):</h3>
        
        <h4>Shift Management:</h4>
        <div class="example-query" onclick="setQuery('Give MR A shifts at BIMM from monday to saturday everyday at 5:00 pm to 10:00pm')">Create recurring shifts</div>
        <div class="example-query" onclick="setQuery('Create shifts for John at Store1 from 9 AM to 5 PM tomorrow')">Create single shift</div>
        
        <h4>Analytics:</h4>
        <div class="example-query" onclick="setQuery('How many times did John start his shift late?')">Lateness analysis</div>
        <div class="example-query" onclick="setQuery('What is the attendance rate for this week?')">Attendance report</div>
        
        <h4>Payroll:</h4>
        <div class="example-query" onclick="setQuery('What is the total pay for Sarah last week?')">Pay calculation</div>
        <div class="example-query" onclick="setQuery('Mark Mike salary as paid')">Mark as paid</div>
        
        <h4>General:</h4>
        <div class="example-query" onclick="setQuery('What can you help me with?')">Get help</div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001';

        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/`);
                const data = await response.json();
                document.getElementById('health-status').innerHTML = `
                    <div class="response success">
                        <strong>Status:</strong> ${data.status}<br>
                        <strong>Agents:</strong> ${data.agents.join(', ')}<br>
                        <strong>Version:</strong> ${data.version}
                    </div>
                `;
            } catch (error) {
                document.getElementById('health-status').innerHTML = `
                    <div class="response error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        }

        async function sendQuery() {
            const query = document.getElementById('query-input').value;
            if (!query.trim()) {
                alert('Please enter a query');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                const responseDiv = document.getElementById('query-response');
                
                responseDiv.innerHTML = `
                    <div class="response ${data.success ? 'success' : 'error'}">
                        <strong>Query:</strong> ${query}<br>
                        <strong>Agent Used:</strong> ${data.agent_used || 'None'}<br>
                        <strong>Success:</strong> ${data.success}<br>
                        <strong>Response:</strong> ${data.message}<br>
                        ${data.data ? `<strong>Data:</strong> ${JSON.stringify(data.data, null, 2)}` : ''}
                    </div>
                `;
            } catch (error) {
                document.getElementById('query-response').innerHTML = `
                    <div class="response error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        }

        function setQuery(query) {
            document.getElementById('query-input').value = query;
        }

        // Check health on page load
        window.onload = function() {
            checkHealth();
        };
    </script>
</body>
</html>
